name: Cross-Compile Raspberry Pi Kernels (v6.18 BTF)

on:
  workflow_dispatch:
  push:
    branches:
      - rpi-6.18.y

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: pi4
            defconfig: bcm2711_defconfig
            image_name: kernel8.img
            board_num: 4
          - board: pi5
            defconfig: bcm2712_defconfig
            image_name: kernel_2712.img
            board_num: 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Dependencies & Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            pahole \
            git \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu

      - name: Configure Kernel with BTF
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- ${{ matrix.defconfig }}
          ./scripts/config --enable CONFIG_DEBUG_INFO
          ./scripts/config --enable CONFIG_DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT
          ./scripts/config --enable CONFIG_DEBUG_INFO_BTF
          yes "" | make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- oldconfig

      - name: Build Kernel Image & DTBs
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) Image dtbs

      - name: Package Kernel Output
        run: |
          mkdir -p kernel_output/boot/overlays
          cp arch/arm64/boot/Image kernel_output/boot/${{ matrix.image_name }}
          cp arch/arm64/boot/dts/broadcom/*.dtb kernel_output/boot/ 2>/dev/null || true
          cp arch/arm64/boot/dts/overlays/*.dtbo kernel_output/boot/overlays/ 2>/dev/null || true
          
          tar -czf kernel-${{ matrix.board }}-btf-v6.18.tar.gz -C kernel_output .

      - name: Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-${{ matrix.board }}-v6.18-${{ github.run_number }}
          name: "Raspberry Pi ${{ matrix.board_num }} Kernel v6.18 (BTF Support)"
          body: |
            自动编译的树莓派 ${{ matrix.board_num }} Linux 6.18 内核镜像。
            - 包含完整的 eBPF/BTF 调试支持 (`CONFIG_DEBUG_INFO_BTF=y`)
            - 附带匹配的设备树文件
          files: kernel-${{ matrix.board }}-btf-v6.18.tar.gz
