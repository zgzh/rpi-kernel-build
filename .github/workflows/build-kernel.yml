name: Kernel Config Test

on:
  workflow_dispatch:

jobs:
  config:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - model: pi3
            defconfig: bcm2711_defconfig

          - model: pi4
            defconfig: bcm2711_defconfig

          - model: pi5
            defconfig: bcm2712_defconfig

    name: Config ${{ matrix.model }}

    steps:
      - name: Checkout Raspberry Pi Linux
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/linux
          ref: rpi-6.18.y
          path: linux
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            debhelper \
            debhelper-compat \
            libssl-dev \
            bc \
            bison \
            flex \
            dwarves \
            libssl-dev \
            libelf-dev \
            libdw-dev \
            libncurses-dev \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu

      - name: Verify pahole
        run: |
          which pahole
          pahole --version

      - name: Configure Kernel
        run: |
          cd linux

          make \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            ${{ matrix.defconfig }}

          ./scripts/config --enable CONFIG_BPF
          ./scripts/config --enable CONFIG_BPF_SYSCALL
          ./scripts/config --enable CONFIG_DEBUG_INFO
          ./scripts/config --enable CONFIG_DEBUG_INFO_BTF
          ./scripts/config --enable CONFIG_DEBUG_INFO_DWARF5

          make \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

      - name: Verify Config
        run: |
          cd linux

          grep '^CONFIG_BPF=y' .config
          grep '^CONFIG_BPF_SYSCALL=y' .config
          grep '^CONFIG_DEBUG_INFO=y' .config
          grep '^CONFIG_DEBUG_INFO_BTF=y' .config

          echo
          echo "Kernel release:"
          make kernelrelease

      - name: Check Build Dependencies
        run: |
          cd linux
          dpkg-checkbuilddeps debian/control || true


      - name: Build Kernel
        run: |
          cd linux

          make \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            -j$(nproc) \
            Image modules dtbs

      - name: Verify vmlinux
        run: |
          cd linux

          test -f vmlinux

          ls -lh vmlinux

          file vmlinux

      - name: Verify BTF
        run: |
          cd linux

          readelf -S vmlinux | grep '\.BTF'

      - name: Package Output
        run: |
          cd linux

          mkdir -p ../release/${{ matrix.model }}/boot
          mkdir -p ../release/${{ matrix.model }}/modules

          cp arch/arm64/boot/Image \
            ../release/${{ matrix.model }}/boot/

          cp arch/arm64/boot/dts/broadcom/*.dtb \
            ../release/${{ matrix.model }}/boot/ || true

          cp arch/arm64/boot/dts/overlays/*.dtbo \
            ../release/${{ matrix.model }}/boot/ || true

          cp arch/arm64/boot/dts/overlays/README \
            ../release/${{ matrix.model }}/boot/ || true

          make \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            INSTALL_MOD_PATH=../release/${{ matrix.model }}/modules \
            modules_install

          rm -f ../release/${{ matrix.model }}/modules/lib/modules/*/build

          rm -f ../release/${{ matrix.model }}/modules/lib/modules/*/source






      - name: Show Package Size
        run: |
          du -sh release/${{ matrix.model }}

      - name: Create Archive
        run: |
          cd release
          tar czf kernel-${{ matrix.model }}.tar.gz ${{ matrix.model }}

      - name: Upload Packages
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.model }}
          path: release/kernel-${{ matrix.model }}.tar.gz
