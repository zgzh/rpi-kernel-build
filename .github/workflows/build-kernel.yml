name: Kernel Source Test

on:
  workflow_dispatch:

jobs:
  source:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - model: pi3
            defconfig: bcmrpi3_defconfig

          - model: pi4
            defconfig: bcm2711_defconfig

          - model: pi5
            defconfig: bcm2712_defconfig

    name: Source ${{ matrix.model }}

    steps:
      - name: Checkout Raspberry Pi Linux
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/linux
          ref: rpi-6.18.y
          path: linux
          fetch-depth: 1

      - name: Show Source Info
        run: |
          cd linux

          echo "MODEL=${{ matrix.model }}"

          echo
          echo "Commit:"
          git rev-parse HEAD

          echo
          echo "Latest:"
          git log -1 --oneline

          echo
          echo "Top files:"
          ls -lah | head
