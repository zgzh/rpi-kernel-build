name: Remote RPi Kernel Build (DEB)

on:
workflow_dispatch:
  inputs:
    kernel_branch:
      description: 'Target branch from official repo'
      required: true
      default: 'rpi-6.18.y'

jobs:
build:
  runs-on: ubuntu-latest
  strategy:
    fail-fast: false
    matrix:
      include:
        - board: pi4
          defconfig: bcm2711_defconfig
          board_num: "4"
        - board: pi5
          defconfig: bcm2712_defconfig
          board_num: "5"

  steps:
    - name: Clone Official Raspberry Pi Kernel Source
      uses: actions/checkout@v4
      with:
        repository: 'raspberrypi/linux'
        ref: ${{ github.event.inputs.kernel_branch || 'rpi-6.18.y' }}
        depth: 1

    - name: Install Dependencies & Toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential bc bison flex libssl-dev libelf-dev libdw-dev \
          debhelper pahole git gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu dpkg-dev

    - name: Build kernel arm64
      run: |
        cd linux
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- ${{ matrix.defconfig }}
        ./scripts/config --enable CONFIG_DEBUG_INFO
        ./scripts/config --enable CONFIG_DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT
        ./scripts/config --enable CONFIG_DEBUG_INFO_BTF
        yes "" | make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- oldconfig
        export DEB_HOST_ARCH=arm64
        sed -i 's/dpkg-buildpackage /dpkg-buildpackage -d /g' scripts/Makefile.package
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- bindeb-pkg -j$(nproc)

    - name: Tar build
      run: |
        mkdir -p deb_output
        mv linux/../*.deb deb_output/ || mv ../*.deb deb_output/ || true
        tar -czf kernel-${{ matrix.board }}-deb.tar.gz -C deb_output .

    - name: Upload results
      uses: softprops/action-gh-release@v2
      with:
        tag_name: kernel-${{ matrix.board }}-deb-${{ github.run_number }}
        name: "Raspberry Pi ${{ matrix.board_num }} Kernel (Debian Package)"
        files: kernel-${{ matrix.board }}-deb.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
