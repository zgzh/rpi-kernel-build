name: Cross-Compile Raspberry Pi Kernels (v6.18 DEB)

on:
  workflow_dispatch:
  push:
    branches:
      - rpi-6.18.y

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: pi4
            defconfig: bcm2711_defconfig
          - board: pi5
            defconfig: bcm2712_defconfig

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Dependencies & Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            pahole \
            git \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            dpkg-dev

      - name: Configure Kernel with BTF
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- ${{ matrix.defconfig }}
          ./scripts/config --enable CONFIG_DEBUG_INFO
          ./scripts/config --enable CONFIG_DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT
          ./scripts/config --enable CONFIG_DEBUG_INFO_BTF
          yes "" | make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- oldconfig

      - name: Build Kernel Debian Packages
        run: |
          # bindeb-pkg 会自动编译内核、模块、设备树，并在源码目录的上一级生成对应的 .deb 包
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- bindeb-pkg -j$(nproc)

      - name: Package Deb Artifacts
        run: |
          mkdir -p deb_output
          # 将上一级目录生成的 deb 文件移动到当前收集目录
          mv ../*.deb deb_output/
          
          # 打包成 tar.gz 方便一次性上传到 Release
          tar -czf kernel-${{ matrix.board }}-deb-v6.18.tar.gz -C deb_output .

      - name: Release and Upload Deb Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-${{ matrix.board }}-deb-v6.18-${{ github.run_number }}
          name: "Raspberry Pi ${{ matrix.board == 'pi4' ? '4' : '5' }} Kernel v6.18 (Debian Package)"
          body: |
            自动编译的树莓派 ${{ matrix.board == 'pi4' ? '4' : '5' }} Linux 6.18 标准 Debian 安装包。
            - 包含 `linux-image` 等 `.deb` 文件
            - 包含完整的 eBPF/BTF 调试支持 (`CONFIG_DEBUG_INFO_BTF=y`)
            - 在树莓派上下载后可通过 `sudo dpkg -i linux-image-*.deb` 直接安装
          files: kernel-${{ matrix.board }}-deb-v6.18.tar.gz
