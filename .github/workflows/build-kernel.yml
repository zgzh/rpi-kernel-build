name: Remote RPi Kernel Build (DEB)

on:
workflow_dispatch:
  inputs:
    kernel_branch:
      description: 'Target branch from official repo'
      required: true
      default: 'rpi-6.18.y'

jobs:
build:
  runs-on: ubuntu-latest
  steps:
    - name: Clone Official Raspberry Pi Kernel Source
      uses: actions/checkout@v4
      with:
        repository: 'raspberrypi/linux'
        ref: ${{ github.event.inputs.kernel_branch || 'rpi-6.18.y' }}
        path: 'linux'
        depth: 1

    - name: Install Dependencies & Multiarch Toolchain
      run: |
        sudo dpkg --add-architecture arm64
        sudo apt-get update
        sudo apt-get install -y \
          build-essential bc bison flex libssl-dev libelf-dev libdw-dev \
          debhelper pahole git gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu dpkg-dev

    - name: Configure and Build Kernel DEB
      run: |
        cd linux
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- bcm2712_defconfig
        ./scripts/config --enable CONFIG_DEBUG_INFO
        ./scripts/config --enable CONFIG_DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT
        ./scripts/config --enable CONFIG_DEBUG_INFO_BTF
        yes "" | make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- oldconfig
        
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export KDEB_COMPRESS=gzip
        
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- bindeb-pkg -j$(nproc)
      env:
        DEB_BUILD_OPTIONS: "nocheck"

    - name: Package Deb Artifacts
      run: |
        mkdir -p deb_output
        mv ../*.deb deb_output/ 2>/dev/null || mv linux/*.deb deb_output/ 2>/dev/null || true
        ls -la deb_output/
        tar -czf kernel-pi5-deb.tar.gz -C deb_output .

    - name: Release and Upload Deb Asset
      uses: softprops/action-gh-release@v2
      with:
        tag_name: kernel-pi5-deb-${{ github.run_number }}
        name: "Raspberry Pi 5 Kernel (Debian Package)"
        files: kernel-pi5-deb.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
