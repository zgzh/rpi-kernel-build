name: Build Raspberry Pi Kernel

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "Raspberry Pi kernel branch"
        required: true
        default: "rpi-6.18.y"

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - model: pi3
            defconfig: bcmrpi3_defconfig

          - model: pi4
            defconfig: bcm2711_defconfig

          - model: pi5
            defconfig: bcm2712_defconfig

    name: Build ${{ matrix.model }}

    steps:
      - name: Checkout Workflow Repository
        uses: actions/checkout@v4

      - name: Generate yamllint Config
        run: |
          cat > .yamllint <<'YAML'
          extends: default

          rules:
            document-start: disable

            line-length:
              max: 200
              level: warning

            comments:
              min-spaces-from-content: 1

            truthy:
              allowed-values:
                - "true"
                - "false"
                - "on"
                - "off"

            indentation:
              spaces: 2
              indent-sequences: consistent

            empty-lines:
              max: 2
              max-start: 0
              max-end: 1
          YAML

      - name: Validate YAML
        run: |
          sudo apt-get update
          sudo apt-get install -y yamllint
          yamllint -c .yamllint .github/workflows

      - name: Validate Workflow
      - name: Install actionlint

        run: |

          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)



      - name: Validate Workflow

        run: |

          ./actionlint -color
      - name: Checkout Raspberry Pi Linux
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/linux
          ref: ${{ github.event.inputs.kernel_branch }}
          path: linux
          fetch-depth: 1

      - name: Show Source Information
        run: |
          cd linux

          echo "==== COMMIT ===="
          git rev-parse HEAD

          echo
          git log -1 --oneline

      - name: Install Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            git \
            rsync \
            cpio \
            kmod \
            debhelper \
            dwarves \
            fakeroot \
            libssl-dev \
            libelf-dev \
            libdw-dev \
            libncurses-dev \
            python3 \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu

      - name: Verify pahole
        run: |
          echo "==== PAHOLE ===="

          which pahole

          pahole --version

      - name: Configure Kernel
        run: |
          cd linux

          make \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            ${{ matrix.defconfig }}

          ./scripts/config --enable CONFIG_BPF
          ./scripts/config --enable CONFIG_BPF_SYSCALL
          ./scripts/config --enable CONFIG_DEBUG_INFO
          ./scripts/config --enable CONFIG_DEBUG_INFO_BTF
          ./scripts/config --enable CONFIG_DEBUG_INFO_DWARF5

          make \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

      - name: Verify Kernel Configuration
        run: |
          cd linux

          grep -q "^CONFIG_BPF=y" .config
          grep -q "^CONFIG_BPF_SYSCALL=y" .config
          grep -q "^CONFIG_DEBUG_INFO=y" .config
          grep -q "^CONFIG_DEBUG_INFO_BTF=y" .config

          echo "Configuration OK"

      - name: Build Debian Packages
        run: |
          cd linux

          export KBUILD_BUILD_USER=github
          export KBUILD_BUILD_HOST=actions

          make \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KDEB_PKGVERSION=$(date +%Y%m%d)-${GITHUB_RUN_NUMBER}-${{ matrix.model }} \
            -j$(nproc) \
            bindeb-pkg

      - name: Verify vmlinux and BTF
        run: |
          cd linux

          test -f vmlinux

          echo "==== VMLINUX ===="
          ls -lh vmlinux

          echo
          echo "==== BTF ===="

          readelf -S vmlinux | grep -q '\.BTF'

          readelf -S vmlinux | grep '\.BTF'

      - name: Verify Packages
        run: |
          find .. -maxdepth 1 -name "*.deb" -ls

          test -n "$(find .. -maxdepth 1 -name '*.deb')"

      - name: Collect Packages
        run: |
          mkdir -p release/${{ matrix.model }}

          find .. -maxdepth 1 -name "*.deb" \
            -exec cp {} release/${{ matrix.model }}/ \;

          find .. -maxdepth 1 -name "*.changes" \
            -exec cp {} release/${{ matrix.model }}/ \;

          find .. -maxdepth 1 -name "*.buildinfo" \
            -exec cp {} release/${{ matrix.model }}/ \;

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.model }}
          path: release/${{ matrix.model }}

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-${{ github.run_number }}
          files: release/${{ matrix.model }}/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
