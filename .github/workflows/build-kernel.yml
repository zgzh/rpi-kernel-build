name: Remote RPi Kernel Build

on:
workflow_dispatch:
  inputs:
    kernel_branch:
      description: 'Target branch from official repo'
      required: true
      default: 'rpi-6.18.y'

jobs:
build:
  runs-on: ubuntu-latest
  steps:
    - name: Clone Official Raspberry Pi Kernel Source
      uses: actions/checkout@v4
      with:
        repository: 'raspberrypi/linux'
        ref: ${{ github.event.inputs.kernel_branch || 'rpi-6.18.y' }}
        path: 'linux'
        depth: 1

    - name: Install Dependencies & Toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential bc bison flex libssl-dev libelf-dev libdw-dev \
          debhelper pahole git gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

    - name: Configure and Compile Kernel
      run: |
        cd linux
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- bcm2712_defconfig
        ./scripts/config --enable CONFIG_DEBUG_INFO
        ./scripts/config --enable CONFIG_DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT
        ./scripts/config --enable CONFIG_DEBUG_INFO_BTF
        yes "" | make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- oldconfig
        
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) Image modules dtbs

    - name: Package Kernel Artifacts
      run: |
        cd linux
        mkdir -p output/boot/firmware/overlays output/lib/modules
        
        # 收集内核镜像与设备树
        cp arch/arm64/boot/Image ../output/boot/kernel_2712.img
        cp arch/arm64/boot/dts/broadcom/*.dtb ../output/boot/firmware/
        cp arch/arm64/boot/dts/overlays/*.dtb* ../output/boot/firmware/overlays/
        cp arch/arm64/boot/dts/overlays/README ../output/boot/firmware/overlays/
        
        # 安装模块
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- INSTALL_MOD_PATH=../output modules_install
        
        cd ../output
        tar -czf ../kernel-pi5-bin.tar.gz .

    - name: Release and Upload Asset
      uses: softprops/action-gh-release@v2
      with:
        tag_name: kernel-pi5-bin-${{ github.run_number }}
        name: "Raspberry Pi 5 Kernel Binary (Tarball)"
        files: kernel-pi5-bin.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
