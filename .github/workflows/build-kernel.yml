name: Matrix Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        model:
          - pi3
          - pi4
          - pi5

    name: Test ${{ matrix.model }}

    steps:
      - uses: actions/checkout@v4

      - name: Show Matrix Info
        run: |
          echo "MODEL=${{ matrix.model }}"
          uname -a
