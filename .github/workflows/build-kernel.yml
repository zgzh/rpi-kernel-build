name: Remote RPi Kernel Build (v6.18 DEB)

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'Target branch from official repo'
        required: true
        default: 'rpi-6.18.y'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: pi4
            defconfig: bcm2711_defconfig
            board_num: 4
          - board: pi5
            defconfig: bcm2712_defconfig
            board_num: 5

    steps:
      - name: Clone Official Raspberry Pi Kernel Source
        uses: actions/checkout@v4
        with:
          repository: 'raspberrypi/linux'
          ref: ${{ github.event.inputs.kernel_branch || 'rpi-6.18.y' }}
          depth: 1

      - name: Install Dependencies & Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libdw-dev \
            debhelper \
            pahole \
            git \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            dpkg-dev

      - name: Configure Kernel with BTF
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- ${{ matrix.defconfig }}
          ./scripts/config --enable CONFIG_DEBUG_INFO
          ./scripts/config --enable CONFIG_DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT
          ./scripts/config --enable CONFIG_DEBUG_INFO_BTF
          yes "" | make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- oldconfig

      - name: Build Kernel Debian Packages
        run: |
          export DEB_HOST_ARCH=arm64
          sed -i 's/dpkg-buildpackage /dpkg-buildpackage -d /g' scripts/Makefile.package
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- bindeb-pkg -j1

      - name: Package Deb Artifacts
        run: |
          mkdir -p deb_output
          mv ../*.deb deb_output/
          tar -czf kernel-${{ matrix.board }}-deb-v6.18.tar.gz -C deb_output .

      - name: Release and Upload Deb Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-${{ matrix.board }}-deb-v6.18-${{ github.run_number }}
          name: "Raspberry Pi ${{ matrix.board_num }} Kernel v6.18 (Debian Package)"
          body: |
            ### 🚀 树莓派 ${{ matrix.board_num }} Linux 6.18 内核包
            - 包含完整的 eBPF/BTF 调试支持 (`CONFIG_DEBUG_INFO_BTF=y`)
            - 采用单线程 `-j1` 规避设备树并发打包冲突

            ---

            ### 📦 保姆级安装与配置指南

            下载并解压对应的 `.tar.gz` 压缩包后，在树莓派本地执行以下步骤：

            #### 1. 安装 Debian 软件包
            进入解压后的 deb 文件目录，依次安装头文件和内核镜像：
            ```bash
            sudo dpkg -i linux-headers-*.deb
            sudo dpkg -i linux-image-*.deb
            ```

            #### 2. 同步内核文件到引导分区（关键避坑步）
            由于树莓派新版系统（Bookworm 及更新版本）使用 `/boot/firmware/` 作为底层 FAT 引导分区，必须将系统 `/boot/` 下生成的新内核及 initrd 复制过去：
            ```bash
            # 请根据实际生成的版本号替换文件名
            sudo cp /boot/vmlinuz-6.18.60-v8+ /boot/firmware/
            sudo cp /boot/initrd.img-6.18.60-v8+ /boot/firmware/
            ```

            #### 3. 修改引导配置文件
            打开真实的引导配置：
            ```bash
            sudo nano /boot/firmware/config.txt
            ```
            在文件的最末尾 `[all]` 节下方添加以下两行：
            ```text
            kernel=vmlinuz-6.18.60-v8+
            initramfs initrd.img-6.18.60-v8+ followkernel
            ```
            保存并退出（`Ctrl + O` 保存，`Enter` 确认，`Ctrl + X` 退出）。

            #### 4. 重启生效
            ```bash
            sync
            sudo reboot
            ```
            重启后通过 `uname -r` 即可验证新内核是否生效。
          files: kernel-${{ matrix.board }}-deb-v6.18.tar.gz
