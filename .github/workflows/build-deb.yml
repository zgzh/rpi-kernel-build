name: Cross-Compile Raspberry Pi Kernels (DEB)

on:
  workflow_dispatch:
  push:
    branches:
      - rpi-6.18.y
      - rpi-7.4.y
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: write

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Upstream Changes
        id: check
        run: |
          git remote add upstream https://github.com/raspberrypi/linux.git
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          git fetch upstream $BRANCH_NAME
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse upstream/$BRANCH_NAME)" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check-changes
    if: needs.check-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: pi4
            defconfig: bcm2711_defconfig
            board_num: 4
            kernel_img: kernel8.img
          - board: pi5
            defconfig: bcm2712_defconfig
            board_num: 5
            kernel_img: kernel_2712.img

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone Upstream Kernel Source
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          git clone --depth=1 https://github.com/raspberrypi/linux.git -b $BRANCH_NAME ../linux-src

      - name: Install Dependencies & Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev libdw-dev debhelper pahole git gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu dpkg-dev

      - name: Configure Kernel with BTF
        run: |
          cd ../linux-src
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- ${{ matrix.defconfig }}
          ./scripts/config --enable CONFIG_DEBUG_INFO
          ./scripts/config --enable CONFIG_DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT
          ./scripts/config --enable CONFIG_DEBUG_INFO_BTF
          yes "" | make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- oldconfig

      - name: Build Kernel Debian Packages
        run: |
          cd ../linux-src
          export DEB_HOST_ARCH=arm64
          KERNEL_RELEASE=$(make kernelrelease)
          export KDEB_PKGVERSION="99:${KERNEL_RELEASE}-${{ github.run_number }}-1"
          echo "==> Building kernel with Epoch version: $KDEB_PKGVERSION"
          sed -i 's/dpkg-buildpackage /dpkg-buildpackage -d /g' scripts/Makefile.package
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- bindeb-pkg -j1

      - name: Build RPi Boot Configurator Deb
        run: |
          PKG_DIR="rpi-boot-configurator"
          mkdir -p ${PKG_DIR}/DEBIAN
          mkdir -p ${PKG_DIR}/etc/initramfs-tools/conf.d

          # 写入 drop-in 配置，优先级高于 initramfs.conf，强制目标机使用 MODULES=most
          cat << 'EOF_CONF' > ${PKG_DIR}/etc/initramfs-tools/conf.d/99-rpi-modules.conf
          MODULES=most
          EOF_CONF

          cat << 'EOF_CTRL' > ${PKG_DIR}/DEBIAN/control
          Package: rpi-boot-configurator-${{ matrix.board }}
          Version: 1.0-${{ github.run_number }}
          Section: utils
          Priority: optional
          Architecture: all
          Maintainer: RPi Builder <noreply@github.com>
          Description: Automated boot config and initramfs safeguard for Raspberry Pi ${{ matrix.board_num }}
          EOF_CTRL

          # 安装前脚本：提前修正目标机 initramfs.conf，避免同批次安装 linux-image 时触发报障
          cat << 'EOF_PRE' > ${PKG_DIR}/DEBIAN/preinst
          #!/bin/bash
          set -e
          if [ "$1" = "install" ] || [ "$1" = "upgrade" ]; then
              if [ -f /etc/initramfs-tools/initramfs.conf ]; then
                  sed -i 's/^MODULES=.*/MODULES=most/' /etc/initramfs-tools/initramfs.conf || true
              fi
          fi
          exit 0
          EOF_PRE

          cat << 'EOF_POST' > ${PKG_DIR}/DEBIAN/postinst
          #!/bin/bash
          set -e
          if [ "$1" = "configure" ]; then
              BOOT_DIR="/boot/firmware"
              [ ! -d "$BOOT_DIR" ] && BOOT_DIR="/boot"
              LATEST_VMLINUZ=$(ls -t /boot/vmlinuz-* 2>/dev/null | head -n 1 | xargs basename || true)
              LATEST_INITRD=$(ls -t /boot/initrd.img-* 2>/dev/null | head -n 1 | xargs basename || true)
              [ -n "$LATEST_VMLINUZ" ] && [ -f "/boot/${LATEST_VMLINUZ}" ] && cp "/boot/${LATEST_VMLINUZ}" "${BOOT_DIR}/"
              CONFIG_FILE="${BOOT_DIR}/config.txt"
              if [ -f "$CONFIG_FILE" ] && [ -n "$LATEST_VMLINUZ" ]; then
                  sed -i '/^kernel=/d' "$CONFIG_FILE"
                  sed -i '/^initramfs /d' "$CONFIG_FILE"
                  echo "kernel=${LATEST_VMLINUZ}" >> "$CONFIG_FILE"
                  [ -n "$LATEST_INITRD" ] && [ -f "/boot/${LATEST_INITRD}" ] && echo "initramfs ${LATEST_INITRD} followkernel" >> "$CONFIG_FILE"
              fi
          fi
          exit 0
          EOF_POST

          chmod +x ${PKG_DIR}/DEBIAN/preinst
          chmod +x ${PKG_DIR}/DEBIAN/postinst
          dpkg-deb --build ${PKG_DIR}
          mkdir -p deb_output
          mv ${PKG_DIR}.deb deb_output/

      - name: Prepare Deb Artifacts Folder
        run: |
          mkdir -p deb_output
          mv ../*.deb deb_output/ 2>/dev/null || true
          mv rpi-boot-configurator*.deb deb_output/ 2>/dev/null || true
          rm -f deb_output/*-dbg*.deb || true

      - name: Release and Upload Individual Deb Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-${{ matrix.board }}-deb-${{ github.run_number }}
          name: "Raspberry Pi ${{ matrix.board_num }} Kernel (Individual DEBs)"
          files: |
            deb_output/*.deb
