name: Build Debian Kernel Packages

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - model: pi34
            defconfig: bcm2711_defconfig

          - model: pi5
            defconfig: bcm2712_defconfig

    name: Build DEB ${{ matrix.model }}

    steps:
      - name: Checkout Raspberry Pi Linux
        uses: actions/checkout@v4
        with:
          repository: 'raspberrypi/linux'
          ref: 'rpi-6.18.y'
          path: 'linux'
          fetch-depth: 1

      - name: Download Official Arm Toolchain (No Apt Needed)
        run: |
          echo "Downloading Arm GNU Toolchain..."
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu/13.2.rel1/binrel/arm-gnu-toolchain-13.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
          
          tar -xf arm-gnu-toolchain-13.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
          
          TOOLCHAIN_PATH=$(pwd)/arm-gnu-toolchain-13.2.rel1-x86_64-aarch64-none-linux-gnu/bin
          echo "$TOOLCHAIN_PATH" >> $GITHUB_PATH
          
          aarch64-none-linux-gnu-gcc --version

      - name: Install Minimal Build Utilities
        run: |
          sudo apt-get install -y --no-install-recommends \
            fakeroot \
            debhelper \
            dwarves \
            libelf-dev \
            libdw-dev || true

      - name: Configure Kernel
        run: |
          cd linux

          make \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-none-linux-gnu- \
            ${{ matrix.defconfig }}

          ./scripts/config --enable CONFIG_BPF
          ./scripts/config --enable CONFIG_BPF_SYSCALL
          ./scripts/config --enable CONFIG_DEBUG_INFO
          ./scripts/config --enable CONFIG_DEBUG_INFO_BTF
          ./scripts/config --enable CONFIG_DEBUG_INFO_DWARF5

          make \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-none-linux-gnu- \
            olddefconfig

      - name: Build Debian Packages
        run: |
          cd linux

          export KBUILD_BUILD_USER=github
          export KBUILD_BUILD_HOST=actions

          make \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-none-linux-gnu- \
            KDEB_PKGVERSION=$(date +%Y%m%d)-${GITHUB_RUN_NUMBER} \
            KDEB_CHANGELOG_DIST=bookworm \
            KBUILD_DEBARCH=arm64 \
            -j$(nproc) \
            bindeb-pkg

      - name: Collect Packages
        run: |
          mkdir -p release/${{ matrix.model }}

          find .. -maxdepth 1 -name "*.deb" \
            -exec cp {} release/${{ matrix.model }}/ \;

          find .. -maxdepth 1 -name "*.changes" \
            -exec cp {} release/${{ matrix.model }}/ \;

          find .. -maxdepth 1 -name "*.buildinfo" \
            -exec cp {} release/${{ matrix.model }}/ \;

          ls -lh release/${{ matrix.model }}

      - name: Upload Packages
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.model }}
          path: release/${{ matrix.model }}
