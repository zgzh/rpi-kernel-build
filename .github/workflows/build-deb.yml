name: Cross-Compile Raspberry Pi Kernels (v6.18 DEB)

on:
  workflow_dispatch:
  push:
    branches:
      - rpi-6.18.y
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: write

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Upstream Changes
        id: check
        run: |
          git remote add upstream https://github.com/raspberrypi/linux.git
          git fetch upstream rpi-6.18.y
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse upstream/rpi-6.18.y)" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check-changes
    if: needs.check-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: pi4
            defconfig: bcm2711_defconfig
            board_num: 4
            kernel_img: kernel8.img
          - board: pi5
            defconfig: bcm2712_defconfig
            board_num: 5
            kernel_img: kernel_2712.img

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync Latest Upstream Kernel Source
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git remote add upstream https://github.com/raspberrypi/linux.git || true
          git fetch upstream rpi-6.18.y
          git merge upstream/rpi-6.18.y --no-edit --allow-unrelated-histories

      - name: Install Dependencies & Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev libdw-dev debhelper pahole git gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu dpkg-dev

      - name: Configure Kernel with BTF
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- ${{ matrix.defconfig }}
          ./scripts/config --enable CONFIG_DEBUG_INFO
          ./scripts/config --enable CONFIG_DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT
          ./scripts/config --enable CONFIG_DEBUG_INFO_BTF
          yes "" | make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- oldconfig

      - name: Build Kernel Debian Packages
        run: |
          export DEB_HOST_ARCH=arm64
          sed -i 's/dpkg-buildpackage /dpkg-buildpackage -d /g' scripts/Makefile.package
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- bindeb-pkg -j1

      - name: Build RPi Boot Configurator Deb
        run: |
          PKG_DIR="rpi-boot-configurator"
          mkdir -p ${PKG_DIR}/DEBIAN
          cat << 'EOF_CTRL' > ${PKG_DIR}/DEBIAN/control
          Package: rpi-boot-configurator-${{ matrix.board }}
          Version: 1.0-${{ github.run_number }}
          Section: utils
          Priority: optional
          Architecture: all
          Maintainer: RPi Builder <noreply@github.com>
          Description: Automated boot config for Raspberry Pi ${{ matrix.board_num }}
          EOF_CTRL
          cat << 'EOF_POST' > ${PKG_DIR}/DEBIAN/postinst
          #!/bin/bash
          set -e
          if [ "$1" = "configure" ]; then
              BOOT_DIR="/boot/firmware"
              [ ! -d "$BOOT_DIR" ] && BOOT_DIR="/boot"
              LATEST_VMLINUZ=$(ls -t /boot/vmlinuz-* 2>/dev/null | head -n 1 | xargs basename || true)
              LATEST_INITRD=$(ls -t /boot/initrd.img-* 2>/dev/null | head -n 1 | xargs basename || true)
              [ -n "$LATEST_VMLINUZ" ] && [ -f "/boot/${LATEST_VMLINUZ}" ] && cp "/boot/${LATEST_VMLINUZ}" "${BOOT_DIR}/"
              CONFIG_FILE="${BOOT_DIR}/config.txt"
              if [ -f "$CONFIG_FILE" ] && [ -n "$LATEST_VMLINUZ" ]; then
                  sed -i '/^kernel=/d' "$CONFIG_FILE"
                  sed -i '/^initramfs /d' "$CONFIG_FILE"
                  echo "kernel=${LATEST_VMLINUZ}" >> "$CONFIG_FILE"
                  [ -n "$LATEST_INITRD" ] && [ -f "/boot/${LATEST_INITRD}" ] && echo "initramfs ${LATEST_INITRD} followkernel" >> "$CONFIG_FILE"
              fi
          fi
          exit 0
          EOF_POST
          chmod +x ${PKG_DIR}/DEBIAN/postinst
          dpkg-deb --build ${PKG_DIR}
          mkdir -p deb_output
          mv ${PKG_DIR}.deb deb_output/

      - name: Package Deb Artifacts
        run: |
          mkdir -p deb_output
          mv ../*.deb deb_output/ 2>/dev/null || true
          tar -czf kernel-${{ matrix.board }}-deb-v6.18.tar.gz -C deb_output .

      - name: Release and Upload Deb Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-${{ matrix.board }}-deb-v6.18-${{ github.run_number }}
          name: "Raspberry Pi ${{ matrix.board_num }} Kernel v6.18 + Boot Configurator"
          files: kernel-${{ matrix.board }}-deb-v6.18.tar.gz
